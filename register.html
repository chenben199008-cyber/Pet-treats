<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="注册威禾小食演示账号">
  <title>注册｜威禾小食</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body class="auth-page" data-auth-page="register">
  <a class="skip-link" href="#auth-main">跳到注册表单</a>

  <header class="auth-header">
    <a class="brand" href="index.html" aria-label="返回威禾小食首页">
      <span class="brand-symbol" aria-hidden="true">禾</span>
      <span class="brand-name">威禾小食<small>WEIHE PET TREATS</small></span>
    </a>
    <a class="auth-back" href="index.html">返回首页</a>
  </header>

  <main class="auth-main" id="auth-main">
    <section class="auth-story" aria-labelledby="story-title">
      <p class="kicker">JOIN WEIHE</p>
      <h1 id="story-title">为毛孩子建立一份，<br><em>简单安心的清单。</em></h1>
      <p>创建本地演示资料，为后续收藏零食和填写收货地址预留体验入口。</p>
      <ul>
        <li>资料仅保存在当前浏览器</li>
        <li>手机号只保存脱敏形式</li>
        <li>可以随时清除演示资料</li>
      </ul>
    </section>

    <section class="auth-card" aria-labelledby="auth-title">
      <p class="kicker">CREATE DEMO ACCOUNT</p>
      <h2 id="auth-title">注册演示账号</h2>
      <p class="auth-intro">填写以下信息，体验注册流程。</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="register-nickname">昵称</label>
          <input id="register-nickname" name="nickname" type="text" autocomplete="nickname" maxlength="20" placeholder="请输入 2–20 个字符" aria-describedby="register-nickname-error">
          <p class="field-error" id="register-nickname-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="register-phone">手机号</label>
          <input id="register-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" aria-describedby="register-phone-error">
          <p class="field-error" id="register-phone-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="register-password">密码</label>
          <div class="password-control">
            <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="请输入至少 6 位密码" aria-describedby="register-password-error">
            <button class="password-toggle" type="button" data-password-toggle="register-password" aria-label="显示密码">显示</button>
          </div>
          <p class="field-error" id="register-password-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="register-confirm-password">确认密码</label>
          <div class="password-control">
            <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="请再次输入密码" aria-describedby="register-confirm-password-error">
            <button class="password-toggle" type="button" data-password-toggle="register-confirm-password" aria-label="显示确认密码">显示</button>
          </div>
          <p class="field-error" id="register-confirm-password-error" aria-live="polite"></p>
        </div>

        <div class="form-status" id="register-status" role="status" aria-live="polite"></div>
        <button class="button button-primary auth-submit" type="submit">创建演示账号</button>
      </form>

      <p class="auth-switch">已有演示账号？<a href="login.html">返回登录</a></p>
      <p class="privacy-note">演示说明：不会创建真实网络账号，密码只用于当前页面校验。</p>
    </section>
  </main>
</body>
</html>
